<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <title>FinanceFlow - Income</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="ff-body">

<div class="ff-app">

    <div th:replace="~{fragments/nav :: sidebar(active='income')}"></div>

    <div class="ff-main">

        <div th:replace="~{fragments/nav :: topbar(pageTitle='Income')}"></div>

        <div class="ff-card mb-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="ff-card-title" style="font-size:1.1rem;">Income</div>
                <div class="ff-badge bg-soft-green" style="padding:8px 16px; font-size:.8rem; cursor:pointer;" onclick="document.getElementById('incomeSource').focus()">
                    <i class="bi bi-plus-lg"></i> Add Income
                </div>
            </div>

            <form th:action="${income.id}==null?'/income/save':'/income/update'" th:object="${income}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="ff-form-label">Income Source</label>
                        <input type="text" id="incomeSource" class="ff-form-control" th:field="*{source}" placeholder="Select Source" required>
                    </div>
                    <div class="col-md-2">
                        <label class="ff-form-label">Amount (Rs.)</label>
                        <input type="number" step="0.01" class="ff-form-control" th:field="*{amount}" placeholder="Enter amount" required>
                    </div>
                    <div class="col-md-2">
                        <label class="ff-form-label">Date</label>
                        <input type="date" class="ff-form-control" th:field="*{date}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="ff-form-label">Description</label>
                        <input type="text" class="ff-form-control" th:field="*{description}" placeholder="Enter description">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="ff-btn ff-btn-success w-100 justify-content-center"><i class="bi bi-save"></i> Save Income</button>
                    </div>
                </div>
            </form>

        </div>

        <div class="ff-card mb-3">
            <div class="row g-2">
                <div class="col-md-4">
                    <form action="/income/search" method="get" class="d-flex gap-2">
                        <input type="text" name="keyword" class="ff-form-control" placeholder="🔍 Search by source">
                        <button class="ff-btn ff-btn-primary">Go</button>
                    </form>
                </div>
                <div class="col-md-3">
                    <form action="/income/filter" method="get" class="d-flex gap-2">
                        <input type="date" name="date" class="ff-form-control">
                        <button class="ff-btn ff-btn-outline">Filter</button>
                    </form>
                </div>
                <div class="col-md-4">
                    <form action="/income/filter-amount" method="get" class="d-flex gap-2">
                        <input type="number" step="0.01" name="min" class="ff-form-control" placeholder="Min">
                        <input type="number" step="0.01" name="max" class="ff-form-control" placeholder="Max">
                        <button class="ff-btn ff-btn-outline">Filter</button>
                    </form>
                </div>
                <div class="col-md-1">
                    <a href="/income" class="ff-btn ff-btn-outline w-100 justify-content-center">Reset</a>
                </div>
            </div>
        </div>

        <div class="ff-card">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="ff-card-title">Income List</div>
            </div>

            <table class="ff-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Source</th>
                    <th>Description</th>
                    <th>Amount (Rs.)</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="income : ${incomeList}">
                    <td th:text="${income.date}"></td>
                    <td th:text="${income.source}"></td>
                    <td th:text="${income.description}"></td>
                    <td th:text="${#numbers.formatDecimal(income.amount,0,'COMMA',2,'POINT')}"></td>
                    <td>
                        <a th:href="@{'/income/edit/' + ${income.id}}" class="ff-btn ff-btn-outline" style="padding:5px 10px; font-size:.78rem;"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/income/delete/' + ${income.id}}" class="ff-btn ff-btn-danger" style="padding:5px 10px; font-size:.78rem;" onclick="return confirm('Delete this income?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${incomeList.isEmpty()}">
                    <td colspan="5" style="text-align:center; color:var(--ff-text-muted);">No income records yet</td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--ff-border);">
                <span style="font-weight:700;">Total Income</span>
                <span style="font-weight:700; color:var(--ff-green); font-size:1.1rem;" th:text="'Rs. ' + ${#numbers.formatDecimal(totalIncome,0,'COMMA',2,'POINT')}"></span>
            </div>

        </div>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
