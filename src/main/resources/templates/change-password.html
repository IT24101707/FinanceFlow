<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FinanceFlow - Change Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="ff-body">

<div class="ff-app">

    <div th:replace="~{fragments/nav :: sidebar(active='profile')}"></div>

    <div class="ff-main">

        <div th:replace="~{fragments/nav :: topbar(pageTitle='Change Password')}"></div>

        <div class="ff-card" style="max-width:480px;">

            <div class="ff-card-title mb-3">🔒 Change Password</div>

            <div class="ff-badge bg-soft-green mb-3" style="display:block; padding:10px 14px;" th:if="${success}" th:text="${success}"></div>
            <div class="ff-badge bg-soft-red mb-3" style="display:block; padding:10px 14px;" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/profile/change-password}" method="post">

                <label class="ff-form-label">Current Password</label>
                <input type="password" name="oldPassword" class="ff-form-control mb-3" required>

                <label class="ff-form-label">New Password</label>
                <input type="password" name="newPassword" class="ff-form-control mb-4" required minlength="4">

                <button type="submit" class="ff-btn ff-btn-primary">Update Password</button>
                <a th:href="@{/profile}" class="ff-btn ff-btn-outline">Back to Profile</a>

            </form>

        </div>

    </div>
</div>

</body>
</html>
