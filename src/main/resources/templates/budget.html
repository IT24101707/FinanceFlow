<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <title>FinanceFlow - Budget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="ff-body">

<div class="ff-app">

    <div th:replace="~{fragments/nav :: sidebar(active='budget')}"></div>

    <div class="ff-main">

        <div th:replace="~{fragments/nav :: topbar(pageTitle='Budget')}"></div>

        <div class="ff-card mb-3">

            <div class="ff-card-title mb-3">Set Monthly Budget</div>

            <form th:action="${budget.id}==null?'/budget/save':'/budget/update'" th:object="${budget}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="ff-form-label">Month</label>
                        <input type="month" class="ff-form-control" th:field="*{month}" required>
                    </div>
                    <div class="col-md-5">
                        <label class="ff-form-label">Budget Amount (Rs.)</label>
                        <input type="number" step="0.01" class="ff-form-control" th:field="*{budgetAmount}" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="ff-btn ff-btn-primary w-100 justify-content-center">Save</button>
                    </div>
                </div>
            </form>

        </div>

        <div class="ff-card">

            <div class="ff-card-title mb-2">Budget History</div>

            <table class="ff-table">
                <thead>
                <tr>
                    <th>Month</th>
                    <th>Budget Amount</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="budget : ${budgetList}">
                    <td th:text="${budget.month}"></td>
                    <td th:text="'Rs. ' + ${#numbers.formatDecimal(budget.budgetAmount,0,'COMMA',2,'POINT')}"></td>
                    <td>
                        <a th:href="@{'/budget/edit/' + ${budget.id}}" class="ff-btn ff-btn-outline" style="padding:5px 10px; font-size:.78rem;"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/budget/delete/' + ${budget.id}}" class="ff-btn ff-btn-danger" style="padding:5px 10px; font-size:.78rem;" onclick="return confirm('Delete this budget?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${budgetList.isEmpty()}">
                    <td colspan="3" style="text-align:center; color:var(--ff-text-muted);">No budgets set yet</td>
                </tr>
                </tbody>
            </table>

        </div>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
