<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <title>FinanceFlow - Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="ff-body">

<div class="ff-app">

    <div th:replace="~{fragments/nav :: sidebar(active='profile')}"></div>

    <div class="ff-main">

        <div th:replace="~{fragments/nav :: topbar(pageTitle='Profile')}"></div>

        <div class="ff-badge bg-soft-green mb-3" style="display:block; padding:10px 14px;" th:if="${success}" th:text="${success}"></div>

        <div class="row g-3">

            <div class="col-lg-7">
                <div class="ff-card h-100">

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <form th:action="@{/profile/photo}" method="post" enctype="multipart/form-data" id="photoForm">
                            <label for="photoInput" style="position:relative; display:block; width:64px; height:64px; cursor:pointer;">
                                <img th:if="${user.photoUrl != null}" th:src="@{'/uploads/' + ${user.photoUrl}}"
                                     id="profilePhotoImg"
                                     onerror="this.style.display='none'; document.getElementById('profilePhotoFallback').style.display='flex';"
                                     style="width:64px; height:64px; border-radius:50%; object-fit:cover; display:block;">
                                <div id="profilePhotoFallback" class="ff-avatar"
                                     th:style="${user.photoUrl == null} ? 'width:64px;height:64px;font-size:1.5rem;' : 'width:64px;height:64px;font-size:1.5rem;display:none;'"
                                     th:text="${user.fullName != null ? #strings.substring(user.fullName,0,1) : 'U'}"></div>
                                <span style="position:absolute; bottom:-2px; right:-2px; width:22px; height:22px; border-radius:50%;
                                             background:var(--ff-blue); color:#fff; display:flex; align-items:center; justify-content:center;
                                             font-size:.7rem; border:2px solid var(--ff-card);"><i class="bi bi-camera-fill"></i></span>
                            </label>
                            <input type="file" id="photoInput" name="photo" accept="image/*" style="display:none;"
                                   onchange="document.getElementById('photoForm').submit();">
                        </form>
                        <div>
                            <div style="font-weight:700; font-size:1.1rem;" th:text="${user.fullName}"></div>
                            <div style="color:var(--ff-text-muted); font-size:.85rem;" th:text="${user.email}"></div>
                        </div>
                    </div>

                    <div class="ff-badge bg-soft-red mb-3" style="display:block; padding:10px 14px;" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/profile/update}" th:object="${user}" method="post">

                        <label class="ff-form-label">Full Name</label>
                        <input type="text" class="ff-form-control mb-3" th:field="*{fullName}" required>

                        <label class="ff-form-label">Email</label>
                        <input type="email" class="ff-form-control mb-3" th:field="*{email}" readonly style="background:#F4F6FB;">

                        <label class="ff-form-label">Phone</label>
                        <input type="text" class="ff-form-control mb-4" th:field="*{phone}" required>

                        <button type="submit" class="ff-btn ff-btn-primary">Update Profile</button>

                    </form>

                </div>
            </div>

            <div class="col-lg-5">
                <div class="ff-card mb-3">
                    <div class="ff-card-title mb-1">Security</div>
                    <div class="ff-card-sub mb-3">Manage your password</div>
                    <a th:href="@{/profile/change-password}" class="ff-btn ff-btn-primary mb-3"><i class="bi bi-shield-lock"></i> Change Password</a>

                    <div class="ff-pref-row" style="border-top:1px solid var(--ff-border); padding-top:14px;">
                        <div>
                            <div class="ff-pref-label">Two Factor Authentication</div>
                            <div class="ff-pref-sub">Add an extra layer of security</div>
                        </div>
                        <label class="ff-switch">
                            <input type="checkbox" checked>
                            <span class="ff-switch-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="ff-card">
                    <div class="ff-card-title mb-2">Preferences</div>

                    <div class="ff-pref-row">
                        <div class="ff-pref-label">Dark Mode</div>
                        <label class="ff-switch">
                            <input type="checkbox" id="darkModeToggle" onchange="ffToggleDarkMode(this)">
                            <span class="ff-switch-slider"></span>
                        </label>
                    </div>

                    <div class="ff-pref-row" style="display:block;">
                        <div class="ff-pref-label mb-2">Currency</div>
                        <select class="ff-form-control">
                            <option>LKR - Sri Lankan Rupee</option>
                            <option>USD - US Dollar</option>
                            <option>EUR - Euro</option>
                            <option>INR - Indian Rupee</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<script>
    document.getElementById('darkModeToggle').checked = document.documentElement.classList.contains('ff-dark');

    function ffToggleDarkMode(el) {
        if (el.checked) {
            document.documentElement.classList.add('ff-dark');
            localStorage.setItem('ff-theme', 'dark');
        } else {
            document.documentElement.classList.remove('ff-dark');
            localStorage.setItem('ff-theme', 'light');
        }
    }
</script>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
