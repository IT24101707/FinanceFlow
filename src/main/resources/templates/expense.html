<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/theme.js}"></script>
    <meta charset="UTF-8">
    <title>FinanceFlow - Expense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="ff-body">

<div class="ff-app">

    <div th:replace="~{fragments/nav :: sidebar(active='expense')}"></div>

    <div class="ff-main">

        <div th:replace="~{fragments/nav :: topbar(pageTitle='Expense')}"></div>

        <div class="ff-card mb-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="ff-card-title" style="font-size:1.1rem;">Expense</div>
                <div class="ff-badge bg-soft-red" style="padding:8px 16px; font-size:.8rem;">
                    <i class="bi bi-plus-lg"></i> Add Expense
                </div>
            </div>

            <form th:action="${expense.id}==null?'/expense/save':'/expense/update'" th:object="${expense}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="ff-form-label">Category</label>
                        <select class="ff-form-control" th:field="*{category}" required>
                            <option value="">Select Category</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="ff-form-label">Amount (Rs.)</label>
                        <input type="number" step="0.01" class="ff-form-control" th:field="*{amount}" placeholder="Enter amount" required>
                    </div>
                    <div class="col-md-2">
                        <label class="ff-form-label">Date</label>
                        <input type="date" class="ff-form-control" th:field="*{date}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="ff-form-label">Description</label>
                        <input type="text" class="ff-form-control" th:field="*{description}" placeholder="Enter description">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="ff-btn ff-btn-danger w-100 justify-content-center"><i class="bi bi-save"></i> Save Expense</button>
                    </div>
                </div>
            </form>

        </div>

        <div class="ff-card mb-3">
            <div class="row g-2">
                <div class="col-md-3">
                    <form action="/expense/search" method="get" class="d-flex gap-2">
                        <input type="text" name="keyword" class="ff-form-control" placeholder="🔍 Search">
                        <button class="ff-btn ff-btn-primary">Go</button>
                    </form>
                </div>
                <div class="col-md-3">
                    <form action="/expense/filter-category" method="get" class="d-flex gap-2">
                        <select name="category" class="ff-form-control" required>
                            <option value="">-- Category --</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                        <button class="ff-btn ff-btn-outline">Filter</button>
                    </form>
                </div>
                <div class="col-md-2">
                    <form action="/expense/filter" method="get" class="d-flex gap-2">
                        <input type="date" name="date" class="ff-form-control">
                        <button class="ff-btn ff-btn-outline">Filter</button>
                    </form>
                </div>
                <div class="col-md-3">
                    <form action="/expense/filter-amount" method="get" class="d-flex gap-2">
                        <input type="number" step="0.01" name="min" class="ff-form-control" placeholder="Min">
                        <input type="number" step="0.01" name="max" class="ff-form-control" placeholder="Max">
                        <button class="ff-btn ff-btn-outline">Filter</button>
                    </form>
                </div>
                <div class="col-md-1">
                    <a href="/expense" class="ff-btn ff-btn-outline w-100 justify-content-center">Reset</a>
                </div>
            </div>
        </div>

        <div class="ff-card">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="ff-card-title">Expense List</div>
            </div>

            <table class="ff-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount (Rs.)</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="expense : ${expenseList}">
                    <td th:text="${expense.date}"></td>
                    <td th:text="${expense.category}"></td>
                    <td th:text="${expense.description}"></td>
                    <td th:text="${#numbers.formatDecimal(expense.amount,0,'COMMA',2,'POINT')}"></td>
                    <td>
                        <a th:href="@{'/expense/edit/' + ${expense.id}}" class="ff-btn ff-btn-outline" style="padding:5px 10px; font-size:.78rem;"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/expense/delete/' + ${expense.id}}" class="ff-btn ff-btn-danger" style="padding:5px 10px; font-size:.78rem;" onclick="return confirm('Delete this expense?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${expenseList.isEmpty()}">
                    <td colspan="5" style="text-align:center; color:var(--ff-text-muted);">No expense records yet</td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--ff-border);">
                <span style="font-weight:700;">Total Expense</span>
                <span style="font-weight:700; color:var(--ff-red); font-size:1.1rem;" th:text="'Rs. ' + ${#numbers.formatDecimal(totalExpense,0,'COMMA',2,'POINT')}"></span>
            </div>

        </div>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
